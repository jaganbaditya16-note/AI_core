name: AICore CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
      - "arena/**"

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Run tests
        run: pytest apps/api/tests

      - name: Ruff
        run: ruff check apps/api/src apps/api/tests

      - name: Mypy
        run: mypy apps/api/src

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare API validation environment
        run: bash scripts/py.sh -c pass

      - name: Validate Compose
        run: bash scripts/validate-compose.sh

      - name: Secret scan
        run: bash scripts/check-secrets.sh