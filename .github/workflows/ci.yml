name: AICore CI

on:
  push:
    branches:
      - main
      - "arena/**"
      - "phase11-12-security-intelligence"
  pull_request:
    branches:
      - main
      - "arena/**"

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Motion verification
        run: npm run verify:motion

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize API environment
        run: bash scripts/py.sh -c "import sys; print(sys.version)"

      - name: Run hermetic tests
        run: bash scripts/py.sh -m pytest -c apps/api/pyproject.toml apps/api/tests

      - name: Run live PostgreSQL verification
        run: bash scripts/test-db.sh

      - name: Ruff lint
        run: bash scripts/py.sh -m ruff check apps/api/src apps/api/tests

      - name: Ruff format
        run: bash scripts/py.sh -m ruff format --check apps/api/src apps/api/tests

      - name: Mypy
        run: bash scripts/py.sh -m mypy apps/api/src

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize API environment
        run: bash scripts/py.sh -c "import sys; print(sys.version)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare API validation environment
        run: bash scripts/py.sh -c pass

      - name: Validate Compose
        run: bash scripts/validate-compose.sh

      - name: Secret scan
        run: bash scripts/check-secrets.sh
