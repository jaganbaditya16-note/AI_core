# Alembic configuration for AICore.
#
# There is deliberately NO `sqlalchemy.url` here. The database URL is a secret
# and is read from the environment (AICORE_DATABASE_URL / .env) by
# database/migrations/env.py, exactly like the application reads it.
#
#   bash scripts/migrate.sh upgrade head

[alembic]
# %(here)s is the directory holding this file, so migrations work from any cwd.
script_location = %(here)s/database/migrations
prepend_sys_path = %(here)s %(here)s/apps/api/src
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
path_separator = os

# Keep autogenerate honest: never emit DDL for tables this project does not own.
# (env.py restricts comparison to the AICore schema.)
# `alembic revision --autogenerate` output is reviewed, never committed blindly.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
